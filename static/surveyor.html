<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RouteWise · סוקר</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<style>
  body { font-size: 16px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
  header.top { padding: 10px 16px; }
  .next {
    background: var(--card); border: 2px solid #e0731a; border-radius: 14px; padding: 14px; margin-bottom: 12px;
  }
  .next .label { color: #e0731a; font-weight: 700; font-size: 13px; }
  .next .addr { font-size: 22px; font-weight: 700; margin: 4px 0 2px; }
  .next .meta { color: var(--muted); font-size: 14px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .btns button, .btns a.btn {
    min-height: 56px; font-size: 18px; font-weight: 700; border-radius: 12px; display: flex;
    align-items: center; justify-content: center; text-decoration: none; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .btn-done { background: var(--ok) !important; border-color: var(--ok) !important; color: #fff !important; grid-column: span 2; min-height: 64px !important; font-size: 21px !important; }
  .btn-nav { background: var(--brand) !important; border-color: var(--brand) !important; color: #fff !important; }
  .btn-not { color: var(--bad) !important; }
  .reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .reasons button { min-height: 52px; font-size: 17px; border-radius: 12px; }
  .tabs { display: flex; gap: 6px; margin: 6px 0 10px; }
  .tabs button { flex: 1; min-height: 44px; font-size: 16px; }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .stop { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line);
          border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .stop .n { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: flex;
             align-items: center; justify-content: center; font-weight: 700; flex: none; }
  .stop.done .n { background: var(--ok); }
  .stop.not_done .n { background: #98a2b3; }
  .stop.done, .stop.not_done { opacity: .7; }
  .stop.is-next { border: 2px solid #e0731a; }
  .stop.is-next .n { background: #e0731a; }
  .stop .a { flex: 1; min-width: 0; }
  .stop .a b { display: block; }
  .stop .a small { color: var(--muted); }
  .stop button { min-height: 40px; }
  #map { height: 62vh; }
  .progress { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .progress .bar { flex: 1; height: 8px; }
  .progress .bar i { background: var(--ok); }
  .finished { text-align: center; background: var(--ok-bg); color: var(--ok); border-radius: 14px; padding: 22px; font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .pick-list button { width: 100%; text-align: right; min-height: 56px; margin-bottom: 8px; font-size: 17px; }
</style>
</head>
<body>
<header class="top">
  <h1><a href="index.html" style="text-decoration:none;color:inherit">Route<span>Wise</span></a></h1>
  <div class="sub" id="whoami">סוקר שטח</div>
</header>
<div class="wrap">
  <div id="pickView" class="hidden"></div>

  <div id="routeView" class="hidden">
    <div class="progress"><span id="progText"></span><div class="bar"><i id="progBar" style="width:0"></i></div></div>
    <div id="nextCard"></div>
    <div class="tabs">
      <button id="tabList" class="on">רשימה</button>
      <button id="tabMap">מפה</button>
    </div>
    <div id="listPane"></div>
    <div id="mapPane" class="hidden"><div id="map"></div></div>
    <p class="hint" style="margin-top:14px" id="startNote"></p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="common.js"></script>
<script src="surveyor.js"></script>
</body>
</html>
